name: Publish GitHub Packages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run npm publish --dry-run without uploading"
        required: false
        default: "false"
      filter:
        description: "Optional comma-separated package names (empty = all)"
        required: false
        default: ""
  push:
    branches:
      - main
    paths:
      - "Soul-DevPortal-Packages/**"
      - "Soul-DevPortal-scripts/publish_github_packages.py"
      - ".github/workflows/publish-packages.yml"

permissions:
  contents: read
  packages: write

jobs:
  publish-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout Soul-DevPortal-Packages
        uses: actions/checkout@v4
        with:
          repository: dheena017/Soul-DevPortal-Packages
          path: Soul-DevPortal-Packages

      - name: Setup Node.js for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
          scope: "@dheena017"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish all Soul-DevPortal-Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ github.event.inputs.filter }}" ]; then
            ARGS="$ARGS --filter ${{ github.event.inputs.filter }}"
          fi
          python Soul-DevPortal-scripts/publish_github_packages.py $ARGS
