name: Build Desktop Release (.exe)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python backend dependencies
        run: python -m pip install -r server/requirements.txt

      - name: Install Node dependencies
        run: npm ci --legacy-peer-deps

      - name: Build production web bundle & portable Windows .exe
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run desktop:build

      - name: Upload portable .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: soul-devportal-win-exe
          path: release/*.exe

      - name: Publish .exe to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
          generate_release_notes: true
