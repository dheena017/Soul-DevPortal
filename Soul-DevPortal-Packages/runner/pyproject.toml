[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workspace-runner"
version = "2.0.0"
description = "Universal Process Supervision, Port Conflict Resolution and Fullstack Dev Runners for Workspace"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["runner", "supervisor", "monorepo", "fastapi", "vite", "windows-job-object"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "workspace-logger>=1.0.0",
]

[project.scripts]
workspace-all = "external.run_all:main"
workspace-dev = "external.run_dev:main"
workspace-client = "external.run_client:main"
workspace-server = "external.run_server:main"
workspace-install = "external.run_install:main"
workspace-typecheck = "external.run_typecheck:main"
workspace-lint = "external.run_lint:main"
workspace-build = "external.run_build:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["internal*", "external*"]

[tool.setuptools.package-data]
"*" = ["py.typed", "*.pyi"]
