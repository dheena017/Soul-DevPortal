[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workspace-runner"
version = "1.0.0"
description = "Universal Process Supervision, Port Conflict Resolution and Fullstack Dev Runners for Workspace"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["runner", "supervisor", "monorepo", "fastapi", "vite", "windows-job-object"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "workspace-logger>=1.0.0",
]

[project.scripts]
workspace-dev = "workspace_runner.bin.run_dev:main"
workspace-frontend = "workspace_runner.bin.run_frontend:main"
workspace-backend = "workspace_runner.bin.run_backend:main"
workspace-install = "workspace_runner.bin.run_install:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["workspace_runner*"]
