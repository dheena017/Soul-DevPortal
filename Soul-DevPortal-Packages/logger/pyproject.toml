[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workspace-logger"
version = "1.0.0"
description = "Universal 5-column server logging, Starlette middleware, and process supervisor for Workspace"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["logger", "fastapi", "uvicorn", "telemetry", "starlette", "supervisor"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Logging",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "starlette>=0.37.0",
    "fastapi>=0.111.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["workspace_logger*"]

[tool.setuptools.package-data]
"*" = ["py.typed", "*.pyi"]
